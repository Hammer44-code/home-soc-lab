# =============================================================================
# Splunk Universal Forwarder — inputs.conf
# Home SOC Lab / Windows 10 victim
# =============================================================================
#
# Install path on the victim:
#   C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
#
# (Preferred: ship this as a deployment app under
#   C:\Program Files\SplunkUniversalForwarder\etc\apps\home-soc-lab\local\inputs.conf
# so upgrades don't clobber it.)
#
# After editing, restart the forwarder from an elevated prompt:
#   Restart-Service SplunkForwarder
#
# Companion file: outputs.conf should point at the indexer, e.g.:
#   [tcpout]
#   defaultGroup = primary_indexers
#   [tcpout:primary_indexers]
#   server = 192.168.56.10:9997
# (outputs.conf lives alongside this file.)
#
# All four channels are pinned to index=endpoint so Sprint 2+ SPL can start
# every search with `index=endpoint` without caring which sourcetype fired.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Windows Security log
#    Primary source of logon (4624/4625), privilege-use, scheduled-task (4698),
#    and object-access events. Loud channel — keep renderXml = false so Splunk
#    gets the parsed key/value representation, which is far easier to search.
# -----------------------------------------------------------------------------
[WinEventLog://Security]
disabled = 0
index = endpoint
renderXml = false


# -----------------------------------------------------------------------------
# 2. Sysmon operational channel
#    Process creation (EID 1), network connections (EID 3), image loads (7),
#    process access (10, e.g. LSASS), file create (11), registry (12-14),
#    DNS (22). The backbone of nearly every detection in /detections/.
# -----------------------------------------------------------------------------
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = endpoint
renderXml = false


# -----------------------------------------------------------------------------
# 3. PowerShell operational channel
#    Script block logging (EID 4104) — captures the deobfuscated content of
#    encoded / obfuscated PowerShell. Must be paired with the Script Block
#    Logging Group Policy enabled on the host (see setup/README.md §4).
# -----------------------------------------------------------------------------
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = endpoint
renderXml = false


# -----------------------------------------------------------------------------
# 4. System log
#    Service installs / starts / stops (EID 7045, 7036), driver loads, and
#    some Windows Defender operational events before Defender is formally
#    configured. Low volume, high value during investigations.
# -----------------------------------------------------------------------------
[WinEventLog://System]
disabled = 0
index = endpoint
renderXml = false


# =============================================================================
# Notes / deferred
# =============================================================================
# - Do NOT enable WinEventLog://Application in this lab. Volume is high,
#   signal is low for the Tier 1 scenarios we care about. Add later if an
#   investigation genuinely needs it.
# - If a detection in Sprint 3 needs Windows Defender operational events,
#   add `[WinEventLog://Microsoft-Windows-Windows Defender/Operational]`
#   as a fifth stanza in a dedicated commit.
# - `renderXml = true` would give verbatim EventData but makes SPL much more
#   brittle. Keep the default parsed representation until a specific search
#   requires otherwise.
